<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solana Ecosystem Pulse — Live Dashboard</title>
<style>
:root{--bg:#06080d;--card:rgba(13,18,28,.92);--border:rgba(77,163,255,.2);--cyan:#00f0ff;--green:#06d6a0;--red:#ff477e;--gold:#ffd166;--text:#e2e8f0;--dim:#94a3b8;--purple:#a855f7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace;min-height:100vh;padding:20px}
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--cyan)}
.header p{font-size:11px;color:var(--dim);margin-top:6px}
.status-bar{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.pill{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;backdrop-filter:blur(10px)}
.card h2{font-size:12px;text-transform:uppercase;color:var(--dim);letter-spacing:.1em;margin-bottom:14px;font-weight:600}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.metric-row:last-child{border:none}
.metric-label{color:var(--dim)}
.metric-value{font-weight:700;color:#fff}
.big-number{font-size:34px;font-weight:800;color:var(--cyan);margin:4px 0 2px}
.sub-text{font-size:11px;color:var(--dim)}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--gold)}
.anomaly-list{list-style:none}
.anomaly-item{padding:9px 11px;background:rgba(255,71,126,.05);border-left:3px solid var(--red);border-radius:5px;margin-bottom:8px;font-size:12px;line-height:1.5}
.anomaly-item.warning{background:rgba(255,209,102,.05);border-left-color:var(--gold)}
.anomaly-ok{padding:12px;background:rgba(6,214,160,.07);border:1px solid rgba(6,214,160,.25);border-radius:8px;color:var(--green);font-size:12px;text-align:center}
.health-circle{width:110px;height:110px;border-radius:50%;margin:0 auto 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--green)}
.health-num{font-size:32px;font-weight:800;color:var(--green)}
.health-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:500;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.03)}
td.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--purple)}
.footer{text-align:center;margin-top:26px;font-size:10px;color:var(--dim);line-height:1.7}
.refresh-info{position:fixed;top:14px;right:14px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-size:10px;color:var(--dim)}
@media(max-width:640px){body{padding:12px}.big-number{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="refresh-info" id="refreshInfo">⏳ Loading…</div>

<div class="header">
<h1>🌐 SOLANA ECOSYSTEM PULSE</h1>
<p>Automated on-chain & off-chain telemetry · Zero private API keys</p>
</div>

<div class="status-bar" id="statusBar"></div>

<div class="grid" id="mainGrid"></div>

<div class="footer">
Data sources: Solana JSON-RPC (public) · CoinGecko / Binance · DeFiLlama<br>
Pipeline v1.0 · Auto-refresh every 60s · Built for Superteam Earn Bounty
</div>

<script>
let lastData=null;
const fmtUsd=v=>v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(2)+'M':'$'+v.toLocaleString(undefined,{maximumFractionDigits:2});
const fmtNum=v=>typeof v==='number'?v.toLocaleString():v;
const pct=v=>`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`;

function metricRow(l,v){return `<div class="metric-row"><span class="metric-label">${l}</span><span class="metric-value">${v}</span></div>`}

function render(d){
 const n=d.network_performance,v=d.validators,e=d.economics,f=d.defi,a=d.anomalies;
 // status bar
 const stColor=a.overall_status==='HEALTHY'?'var(--green)':a.overall_status==='WARNING'?'var(--gold)':'var(--red)';
 document.getElementById('statusBar').innerHTML=`
  <div class="pill"><span class="dot" style="background:${stColor}"></span>${a.overall_status}</div>
  <div class="pill">⚡ ${n.current_tps.toLocaleString()} TPS</div>
  <div class="pill">🔐 Nakamoto: <b>&nbsp;${v.nakamoto_coefficient}</b></div>
  <div class="pill">💰 SOL $${e.price_usd} ${pct(e.change_24h_pct)}</div>
  <div class="pill">🏦 TVL ${fmtUsd(f.tvl_usd)} ${pct(f.tvl_change_24h_pct)}</div>`;
 
 let html='';
 // Anomalies card
 let anomHtml;
 if(a.anomalies.length===0){anomHtml='<div class="anomaly-ok">✅ No anomalies detected.<br>All network telemetry within optimal parameters.</div>'}
 else{anomHtml='<ul class="anomaly-list">'+a.anomalies.map(x=>`<li class="anomaly-item${x.severity==='WARNING'?' warning':''}"><b>[${x.severity}]</b> ${x.metric}: ${x.description}<br><code style="color:var(--cyan)">${x.value}</code></li>`).join('')+'</ul>'}
 
 html+=`<div class="card"><h2>⚠ Anomaly Detection (${a.anomaly_count})</h2>${anomHtml}</div>`;
 
 // Health score
 const hc=a.ecosystem_health_score>=80?'var(--green)':a.ecosystem_health_score>=50?'var(--gold)':'var(--red)';
 html+=`<div class="card" style="text-align:center"><h2>Ecosystem Health Score</h2>
  <div class="health-circle" style="border-color:${hc}"><div class="health-num" style="color:${hc}">${a.ecosystem_health_score}</div><div class="health-lbl">/ 100</div></div>
  <div class="sub-text">Weighted penalty model: −30 CRITICAL · −10 WARNING</div></div>`;
 
 // Network
 const tpsPct=n.current_tps?((n.current_tps-n.avg_tps_30m)/n.avg_tps_30m*100):0;
 html+=`<div class="card"><h2>⚡ Network Performance</h2>
  <div class="big-number">${n.current_tps.toLocaleString()}<span style="font-size:14px;color:var(--dim)"> TPS</span></div>
  <div class="sub-text">30m avg: ${n.avg_tps_30m.toLocaleString()} (${pct(tpsPct)} dev) · Range ${n.min_tps_30m.toLocaleString()}–${n.max_tps_30m.toLocaleString()}</div><br>
  ${metricRow('Epoch','#'+n.epoch+' ('+n.epoch_progress_pct+'%)')}
  ${metricRow('Epoch end','~'+n.est_hours_remaining+'h')}
  ${metricRow('Absolute Slot',fmtNum(n.absolute_slot))}
  ${metricRow('Block Height',fmtNum(n.block_height))}
  ${metricRow('solana-core',n.solana_core_version)}</div>`;
 
 // Validators
 html+=`<div class="card"><h2>🔐 Validators & Decentralization</h2>
  <div class="big-number">${v.active_validators}<span style="font-size:14px;color:var(--dim)"> active</span></div>
  <div class="sub-text">Nakamoto Coefficient: <b style="color:var(--cyan)">${v.nakamoto_coefficient}</b> nodes to halt consensus</div><br>
  ${metricRow('Delinquent',v.delinquent_validators+' ('+v.delinquent_stake_pct+'% stake)')}
  ${metricRow('Total Active Stake',fmtNum(v.total_active_stake_sol)+' SOL')}<br>
  <table><tr><th>#</th><th>Vote Pubkey</th><th>Stake %</th><th>Comm.</th></tr>`+
  v.top_5_validators.map((x,i)=>`<tr><td>${i+1}</td><td class="mono">${x.vote_pubkey}</td><td>${x.stake_pct}%</td><td>${x.commission_pct}%</td></tr>`).join('')+
  `</table></div>`;
 
 // Economics
 html+=`<div class="card"><h2>💰 Token Economics</h2>
  <div class="big-number">$${e.price_usd}<span style="font-size:14px"> ${pct(e.change_24h_pct)}</span></div>
  <div class="sub-text">SOL/USD · 24h volume ${fmtUsd(e.volume_24h_usd)}</div><br>
  ${metricRow('Market Cap',fmtUsd(e.market_cap_usd))}
  ${metricRow('Circulating Supply',fmtNum(Math.round(e.circulating_sol))+' SOL')}
  ${metricRow('Total Supply',fmtNum(Math.round(e.total_supply_sol))+' SOL')}</div>`;
 
 // DeFi
 let protos=f.top_protocols.map(p=>`<tr><td>${p.name}</td><td style="color:var(--dim)">${p.category}</td><td>${fmtUsd(p.tvl_solana_usd)}</td><td>${pct(p.change_1d)}</td></tr>`).join('');
 html+=`<div class="card"><h2>🏦 DeFi & TVL</h2>
  <div class="big-number">${fmtUsd(f.tvl_usd)}<span style="font-size:14px"> ${pct(f.tvl_change_24h_pct)}/24h</span></div>
  <div class="sub-text">7-day trend: ${pct(f.tvl_change_7d_pct)}</div><br>
  <table><tr><th>Protocol</th><th>Cat.</th><th>TVL</th><th>24h</th></tr>${protos}</table></div>`;
 
 document.getElementById('mainGrid').innerHTML=html;
 document.getElementById('refreshInfo').textContent='✓ Updated '+new Date(d.meta.generated_at_utc).toLocaleTimeString()+' UTC';
}

async function loadData(){
 try{
  const r=await fetch('report.json?t='+Date.now());
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  lastData=d;render(d);
 }catch(err){
  document.getElementById('refreshInfo').textContent='⛔ '+err.message;
 }
}
loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
