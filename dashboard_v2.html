<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>solpulse — tui</title>
<style>
/* Terminal / btop aesthetic: pure monospace, box-drawing chars, zero decoration */
:root{--bg:#0a0e14;--fg:#8fa876;--bright:#c5d1b4;--dim:#4d5d45;--cyan:#6fb3bd;--amber:#d7ba7d;--red:#ce6f6f;--border:#2c352b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,'JetBrains Mono','Cascadia Mono',Menlo,monospace;font-size:13px;line-height:1.35;padding:14px;max-width:1100px;margin:0 auto}
.box{border:1px solid var(--border);margin-bottom:10px}
.box-title{color:var(--cyan);padding:3px 10px;border-bottom:1px solid var(--border);background:rgba(111,179,189,.04)}
.box-body{padding:8px 10px}
.row{display:flex;justify-content:space-between;padding:1px 0}
.k{color:var(--dim)}.v{color:var(--bright)}
.hl{color:var(--amber)}.ok{color:#7ec97e}.bad{color:var(--red)}
.bar{display:inline-block;height:10px;vertical-align:middle;background:linear-gradient(90deg,var(--fg) var(--w,50%),transparent 0);outline:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--cyan);font-weight:normal;border-bottom:1px dashed var(--border);padding:2px 6px}
td{padding:2px 6px;color:var(--bright)}
td.num{text-align:right}
.dim{color:var(--dim)}
.head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:12px}
.head .t{color:var(--bright);font-weight:bold}
.up::after{content:"↑";color:var(--ok)}.down::after{content:"↓";color:var(--red)}
@media(max-width:700px){body{font-size:11px}.col{width:100%!important}}
.cols{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
</style>
</head>
<body>
<div class="head">
 <div><span class="t">solpulse</span> <span class="dim">v1.1-tui · mainnet-beta</span></div>
 <div><span id="gen" class="dim">loading…</span> · <span id="next"></span></div>
</div>

<div class="cols">
<div style="flex-direction:column;display:flex;gap:10px" class="col">
<div class="box"><div class="box-title">── network ──────────────────────────</div><div class="box-body" id="p-net"></div></div>
<div class="box"><div class="box-title">── validators ───────────────────────</div><div class="box-body" id="p-val"></div></div>
</div>
<div style="flex-direction:column;display:flex;gap:10px" class="col">
<div class="box"><div class="box-title">── market ───────────────────────────</div><div class="box-body" id="p-mkt"></div></div>
<div class="box"><div class="box-title">── defi ─────────────────────────────</div><div class="box-body" id="p-defi"></div></div>
</div>
</div>

<div class="box"><div class="box-title">── anomalies ────────────────────────</div><div class="box-body" id="p-anom"></div></div>
<div class="box"><div class="box-title">── top validators (stake) ───────────</div><div class="box-body" id="p-top"></div></div>

<script>
const fmtUsd=v=>v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(2)+'M':'$'+Math.round(v).toLocaleString();
const fmtN=v=>Number(v).toLocaleString('en-US');
const bar=(pct,w=20)=>{const f=Math.round(pct/100*w);return '<span class="bar" style="--w:'+Math.min(100,pct)+'%;width:'+(w*7)+'px"></span>'};
const dPct=v=>`<span class="${v>=0?'up':'down'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`;
let nextIn=10;

function row(k,v){return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`}

function render(d){
 const n=d.network_performance,v=d.validators,e=d.economics,f=d.defi,a=d.anomalies;
 document.getElementById('gen').textContent='@'+new Date(d.meta.generated_at_utc).toISOString().slice(11,19)+'Z';
 document.getElementById('p-net').innerHTML=
   row('tps',`${fmtN(n.current_tps)} ${n.current_tps>=n.avg_tps_30m?'<span class="ok">▲</span>':'<span class="bad">▼</span>'}`)+
   row('avg/min/max',`${fmtN(n.avg_tps_30m)} / ${fmtN(n.min_tps_30m)} / ${fmtN(n.max_tps_30m)}`)+
   row('epoch',`#${n.epoch} ${bar(n.epoch_progress_pct)} ${n.epoch_progress_pct}%`)+
   row('eta',`~${n.est_hours_remaining}h`)+
   row('slot',fmtN(n.slot_index))+
   row('block',fmtN(n.block_height))+
   row('core',n.solana_core_version);
 document.getElementById('p-val').innerHTML=
   row('active',fmtN(v.active_validators))+
   row('delinquent',`<span class="${v.delinquent_validators>10?'bad':''}">${v.delinquent_validators}</span> (${v.delinquent_stake_pct}% stake)`)+
   row('nakamoto coeff',`<span class="hl">${v.nakamoto_coefficient}</span>`)+
   row('active stake',fmtN(Math.round(v.total_active_stake_sol))+' SOL');
 document.getElementById('p-mkt').innerHTML=
   row('sol/usd',`<span class="hl">$${e.price_usd}</span> ${dPct(e.change_24h_pct)} <span class="dim">[${(e.price_source||'').toLowerCase()}]</span>`)+
   row('market cap',fmtUsd(e.market_cap_usd))+
   row('volume 24h',fmtUsd(e.volume_24h_usd))+
   row('circ supply',fmtN(Math.round(e.circulating_sol))+' SOL')+
   row('total supply',fmtN(Math.round(e.total_supply_sol))+' SOL');
 let protos=f.top_protocols.slice(0,6).map(p=>row(p.name.toLowerCase(),`${fmtUsd(p.tvl_solana_usd)} ${dPct(p.change_1d)}`)).join('');
 document.getElementById('p-defi').innerHTML=row('chain tvl',`<span class="hl">${fmtUsd(f.tvl_usd)}</span> ${dPct(f.tvl_change_24h_pct)}`)+protos;
 
 const hc=a.ecosystem_health_score;
 document.getElementById('p-anom').innerHTML=
   `<div class="row"><span class="k">status</span><span class="v ${hc>=80?'ok':hc>=50?'hl':'bad'}">${a.overall_status} [${hc}/100] ${bar(hc,15)}</span></div>`+
   (a.anomalies.length?a.anomalies.map(x=>`<div class="row"><span class="k"><span class="${x.severity==='CRITICAL'?'bad':'hl'}">[${x.severity[0]}]</span> ${x.metric}</span><span class="v">${x.value}</span></div>`).join(''):`<div class="row"><span class="k">all checks passed</span><span class="ok">✓</span></div>`);
 
 document.getElementById('p-top').innerHTML='<table><tr><th>#</th><th>vote pubkey</th><th style="text-align:right">stake sol</th><th style="text-align:right">%</th><th style="text-align:right">comm</th></tr>'+
  v.top_5_validators.map((x,i)=>`<tr><td>${i+1}</td><td class="dim">${x.vote_pubkey}</td><td class="num">${fmtN(Math.round(x.stake_sol))}</td><td class="num">${x.stake_pct}%</td><td class="num dim">${x.commission_pct}%</td></tr>`).join('')+'</table>';
}
async function load(){
 try{
  const r=await fetch('report.json?t='+Date.now());
  if(!r.ok)throw 0;
  render(await r.json());
 }catch(err){}
}
load();setInterval(load,10000);
setInterval(()=>{nextIn=nextIn<=0?10:nextIn-1;document.getElementById('next').textContent='upd '+nextIn+'s'},1000);
</script>
<div id="hist-charts" style="padding:8px 12px"></div>
<script src="history_charts.js"></script>
</body>
</html>
